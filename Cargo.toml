[workspace]
members = ["crates/agx-core", "crates/agx-visual", "crates/glassbridge-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
authors = ["HumanCTO"]
license = "Apache-2.0"
repository = "https://github.com/humancto/glass-bridge"
homepage = "https://humancto.github.io/glass-bridge/"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
clap = { version = "4.6.5", features = ["derive"] }
coset = "0.4.2"
crc32fast = "1.5.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
minicbor = { version = "2.3.0", features = ["std"] }
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
quircs = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run licenses:check
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run benchmark:grid-acquisition
      - run: npm run benchmark:grid-recovery

  rust-prototype:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.91.1 --profile minimal --component clippy --component rustfmt
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo run --locked -p glassbridge-cli -- demo --output-dir work/ci-demo
      - run: >-
          cargo run --locked -p glassbridge-cli -- screen-demo
          --output-dir work/ci-screen-demo
          --fps 4
          --frames 24
      - run: >-
          cargo run --locked -p glassbridge-cli -- qr-decode
          --input-dir work/ci-screen-demo/frames
          --output work/ci-screen-demo/recovered-ci.agx
      - run: cmp work/ci-screen-demo/sender-envelope.agx work/ci-screen-demo/recovered-ci.agx
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: ffmpeg -version
      - run: >-
          cargo run --locked -p glassbridge-cli -- video-loopback
          --envelope test-vectors/agx1/valid-envelope.hex
          --output-dir work/ci-video
          --frames 10
          --session-id 474c4153534252494447454d34434931
          --fps 30
          --crf 23
          --scale-percent 100
          --loss 10
          --corruption 0
          --duplicates 0

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  design-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  rust-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.91.1 --profile minimal --component clippy --component rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo run --locked -p glassbridge-cli -- demo --output-dir work/ci-demo
      - run: ffmpeg -version
      - run: >-
          cargo run --locked -p glassbridge-cli -- video-loopback
          --envelope test-vectors/agx1/valid-envelope.hex
          --output-dir work/ci-video
          --frames 10
          --session-id 474c4153534252494447454d34434931
          --fps 30
          --crf 23
          --scale-percent 100
          --loss 10
          --corruption 0
          --duplicates 0

name: Physical device result
description: Contribute repeatable GlassBridge phone-camera measurements.
title: "[device] sender → receiver / profile"
labels:
  - benchmark
  - device-matrix
body:
  - type: markdown
    attributes:
      value: >-
        Thank you for measuring the physical channel. Use synthetic payloads,
        predeclare one named sender/receiver pair and one unchanged condition,
        then run three consecutive attempts. Include warm-ups, failures, aborts,
        and timeouts; do not restart the set to remove a result. A best run by
        itself is not a benchmark.
  - type: input
    id: build
    attributes:
      label: GlassBridge build
      placeholder: Full 40-character SHA from the reviewed clean checkout
    validations:
      required: true
  - type: textarea
    id: sender
    attributes:
      label: Sender
      description: Device, OS, browser, display refresh/resolution, brightness, and whether it was fullscreen.
    validations:
      required: true
  - type: textarea
    id: receiver
    attributes:
      label: Receiver
      description: Device, OS, browser, negotiated camera format/FPS, orientation, and whether it was handheld or propped.
    validations:
      required: true
  - type: input
    id: pair_name
    attributes:
      label: Named device pair
      description: Record the pair once here. Current JSON stores a browser user-agent, not a unique hardware or pair identity; map attachments by run_id/measured_at.
      placeholder: MacBook Pro 14-inch (2024) → iPhone 15 Pro
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Profile and payload
      placeholder: Grid 30 lab, 147456 bytes
    validations:
      required: true
  - type: textarea
    id: runs
    attributes:
      label: All repeated runs
      description: Attach or paste all three consecutive attempts plus any preceding warm-up. Include each `glassbridge-capacity/5` success and every `glassbridge-device-run/1` failure, abort, or timeout; none may be discarded. Physical datasets must use `source_mode: camera`; saved-frame diagnostics are not phone-camera runs.
    validations:
      required: true
  - type: dropdown
    id: timing_basis
    attributes:
      label: Timing basis
      description: Camera-open-to-verified is diagnostic only. A publication comparison requires a synchronized sender optical-start marker.
      options:
        - Synchronized optical start marker
        - Camera-open diagnostic only (not publication eligible)
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Physical setup
      description: Distance, angle, lighting, motion, mounting, and anything else needed to reproduce the condition.
    validations:
      required: true

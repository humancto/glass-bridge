name: Bug report
description: Report a reproducible implementation or documentation problem.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not report security vulnerabilities here. Use the private reporting
        path described in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed result and the result you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Include the smallest exact sequence that reproduces the issue.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build or commit
      placeholder: Commit SHA or the build query value from the demo URL
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Sender OS/browser/display and receiver device/OS/browser.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, screenshots, exported benchmark JSON, or a minimal fixture. Remove private data first.
